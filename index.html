<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- SEO & Branding -->
    <title>Kari King | கறி கிங் — Fresh Meat Delivered Fast</title>
    <meta name="description" content="Kari King — Premium fresh chicken, mutton, and seafood delivered to your doorstep. Order now for fast delivery in your area." />
    <meta name="keywords" content="kari king, fresh meat delivery, chicken delivery, mutton delivery, online meat shop, kariking" />
    <meta name="author" content="Kari King" />
    
    <!-- Theme & PWA -->
    <meta name="theme-color" content="#7A0000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kari King" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.kariking.in/" />
    <meta property="og:title" content="Kari King — Fresh Meat Delivered Fast" />
    <meta property="og:description" content="Premium fresh chicken, mutton, and seafood. Order online for fast doorstep delivery." />
    <meta property="og:site_name" content="Kari King" />
    <meta property="og:image" content="https://app.kariking.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kari King — Fresh Meat Delivered Fast" />
    <meta name="twitter:description" content="Premium fresh chicken, mutton, and seafood. Order online for fast doorstep delivery." />
    <meta name="twitter:image" content="https://app.kariking.in/og-image.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://app.kariking.in/" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Structured Data — Local Business (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "name": "Kari King",
      "alternateName": "கறி கிங்",
      "url": "https://app.kariking.in",
      "logo": "https://app.kariking.in/og-image.png",
      "description": "Premium fresh chicken, mutton, and seafood delivered to your doorstep.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Krishnagiri",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "servesCuisine": "Fresh Meat",
      "priceRange": "₹₹",
      "sameAs": [],
      "potentialAction": {
        "@type": "OrderAction",
        "target": "https://app.kariking.in/products"
      }
    }
    </script>
  </head>
  <body style="background-color: #0b0b0b; margin: 0; min-height: 100vh;">
    <div id="root">
      <!-- Pre-React splash (shown before JS loads, auto-replaced by React) -->
      <div id="pre-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0b0b0b;font-family:Poppins,sans-serif;">
        <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#dc2626;border-radius:50%;animation:kspin 0.8s linear infinite;"></div>
        <p style="margin-top:16px;color:rgba(255,255,255,0.4);font-size:13px;font-weight:600;letter-spacing:0.05em;">Loading Kari King...</p>
      </div>
      <style>@keyframes kspin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
